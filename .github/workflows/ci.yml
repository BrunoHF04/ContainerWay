name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - name: Go test (pacotes sem UI Fyne)
        run: go test ./internal/policy/... ./internal/transfer/... ./internal/hostfs/... ./internal/session/...
